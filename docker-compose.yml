services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tallersmart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tallersmart"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - api_uploads:/app/storage/uploads
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/tallersmart?schema=public
      JWT_SECRET: ${JWT_SECRET:-TallerSmart-local-development-secret-change-before-deployment}
      UPLOAD_DIR: /app/storage/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  api_uploads:
